<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Issue #XX — UI/UX Visual Spec</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 32px 20px 72px; }
    main { max-width: 1100px; margin: 0 auto; }
    header { margin-bottom: 28px; }
    .meta { opacity: .65; }
    .tabs { display: flex; gap: 8px; margin: 20px 0; }
    button { border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas); background: Canvas; color: CanvasText; border-radius: 10px; padding: 9px 14px; cursor: pointer; }
    button[aria-selected="true"] { font-weight: 700; border-color: CanvasText; }
    .stage { border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas); border-radius: 18px; padding: 24px; min-height: 520px; }
    .phone { width: min(390px, 100%); min-height: 700px; margin: 0 auto; border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas); border-radius: 28px; padding: 18px; box-sizing: border-box; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <div class="meta">seok-jun/my-honey-chat · Issue #XX</div>
    <h1>UI/UX Visual Spec 제목</h1>
    <p>이 HTML은 화면 배치, 정보 계층, UI 상태와 인터랙션의 구현 기준이다.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Visual spec state">
    <button type="button" role="tab" aria-selected="true" data-target="current">Current</button>
    <button type="button" role="tab" aria-selected="false" data-target="proposed">Proposed</button>
  </div>

  <section class="stage" id="current">
    <div class="phone">
      <h2>Current</h2>
      <p>현재 UI가 비교에 필요할 때 작성한다. 필요 없으면 이 탭을 제거한다.</p>
    </div>
  </section>

  <section class="stage" id="proposed" hidden>
    <div class="phone">
      <h2>Proposed</h2>
      <p>변경 후 레이아웃, 주요 상태, action 위치를 실제 화면처럼 표현한다.</p>
    </div>
  </section>
</main>
<script>
  const tabs = document.querySelectorAll('[role="tab"]');
  const stages = document.querySelectorAll('.stage');
  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(x => x.setAttribute('aria-selected', String(x === tab)));
    stages.forEach(stage => stage.hidden = stage.id !== tab.dataset.target);
  }));
</script>
</body>
</html>
